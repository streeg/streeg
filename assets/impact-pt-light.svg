<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="492" viewBox="0 0 1200 492" role="img" aria-label="7+ apps bancários: feitos na Dimensa para bancos como Banco BV, Travelex, Dock e Bankly, com Pix em produção · ~3 anos liderando times: dois times de 7 pessoas na Dimensa e um time de 7 pessoas na Ploomes · 12 integrações de CRM: RD Station, WhatsApp, Gmail, Outlook, Google Agenda, Mailchimp, Omie, Zenvia e outras · Frágil → automatizado: deploys levados para CI/CD automatizado no Kubernetes, no lugar de releases manuais frágeis · Sphinx → Elasticsearch: busca da plataforma migrada para Elasticsearch, com busca por palavra-chave e destaque · Motor de receita: construí o módulo de contratações que gere a receita e as comissões do escritório">
  <title>7+ apps bancários: feitos na Dimensa para bancos como Banco BV, Travelex, Dock e Bankly, com Pix em produção · ~3 anos liderando times: dois times de 7 pessoas na Dimensa e um time de 7 pessoas na Ploomes · 12 integrações de CRM: RD Station, WhatsApp, Gmail, Outlook, Google Agenda, Mailchimp, Omie, Zenvia e outras · Frágil → automatizado: deploys levados para CI/CD automatizado no Kubernetes, no lugar de releases manuais frágeis · Sphinx → Elasticsearch: busca da plataforma migrada para Elasticsearch, com busca por palavra-chave e destaque · Motor de receita: construí o módulo de contratações que gere a receita e as comissões do escritório</title>
