<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="492" viewBox="0 0 1200 492" role="img" aria-label="7+ banking apps: shipped on a white-label core, with Pix payments and refunds live in production · 2 teams led: of 6–7 developers each for 2½ years, plus 4 months leading the team at Ploomes · 5 CRM integrations: RD Station, Neppo, Flowbiz, WhatsApp and Facebook Lead Ads, built and maintained · Fragile → automated: deploys moved to CI/CD on Kubernetes: no more manual releases, breakages and rollbacks · Sphinx → Elasticsearch: platform search rebuilt and made dramatically faster, with highlighted keyword matches · Revenue engine: built the placements module that runs the firm's placement revenue and commissions">
  <title>7+ banking apps: shipped on a white-label core, with Pix payments and refunds live in production · 2 teams led: of 6–7 developers each for 2½ years, plus 4 months leading the team at Ploomes · 5 CRM integrations: RD Station, Neppo, Flowbiz, WhatsApp and Facebook Lead Ads, built and maintained · Fragile → automated: deploys moved to CI/CD on Kubernetes: no more manual releases, breakages and rollbacks · Sphinx → Elasticsearch: platform search rebuilt and made dramatically faster, with highlighted keyword matches · Revenue engine: built the placements module that runs the firm's placement revenue and commissions</title>
  <style>
    .glow1 { animation: drift1 20s ease-in-out infinite alternate; }
    .glow2 { animation: drift2 24s ease-in-out infinite alternate; }
