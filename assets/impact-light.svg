<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="492" viewBox="0 0 1200 492" role="img" aria-label="7+ banking apps: built at Dimensa for client banks like Banco BV, Travelex, Dock and Bankly, with Pix live · ~3 yrs leading teams: two teams of 7 people at Dimensa, and a team of 7 at Ploomes · 13 CRM integrations: RD Station, ActiveCampaign, WhatsApp, Gmail, Outlook, Google Calendar, Mailchimp and more · Fragile → automated: deploys moved to automated CI/CD on Kubernetes, replacing fragile manual releases · Sphinx → Elasticsearch: platform search migrated to Elasticsearch, with keyword search and highlighted matches · Revenue engine: built the placements module that runs the firm's placement revenue and commissions">
  <title>7+ banking apps: built at Dimensa for client banks like Banco BV, Travelex, Dock and Bankly, with Pix live · ~3 yrs leading teams: two teams of 7 people at Dimensa, and a team of 7 at Ploomes · 13 CRM integrations: RD Station, ActiveCampaign, WhatsApp, Gmail, Outlook, Google Calendar, Mailchimp and more · Fragile → automated: deploys moved to automated CI/CD on Kubernetes, replacing fragile manual releases · Sphinx → Elasticsearch: platform search migrated to Elasticsearch, with keyword search and highlighted matches · Revenue engine: built the placements module that runs the firm's placement revenue and commissions</title>
  <style>
    .glow1 { animation: drift1 20s ease-in-out infinite alternate; }
    .glow2 { animation: drift2 24s ease-in-out infinite alternate; }
    @keyframes drift1 { to { transform: translate(120px, 40px); } }
    @keyframes drift2 { to { transform: translate(-140px, -30px); } }
    .spin { animation: spin 60s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .rise { animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    .mob { display: none; }
    @media (max-width: 600px) { .desk { display: none; } .mob { display: inline; } }
  </style>
