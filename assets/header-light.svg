<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Guilherme Andreúce, Senior Full-Stack Developer. I build the business-critical parts of a product: search, revenue, payments, integrations and deploys, with AI in the loop.">
  <title>Guilherme Andreúce, Senior Full-Stack Developer. I build the business-critical parts of a product: search, revenue, payments, integrations and deploys, with AI in the loop.</title>
  <style>
    .glow1 { animation: drift1 20s ease-in-out infinite alternate; }
    .glow2 { animation: drift2 24s ease-in-out infinite alternate; }
    @keyframes drift1 { to { transform: translate(120px, 40px); } }
    @keyframes drift2 { to { transform: translate(-140px, -30px); } }
    .spin { animation: spin 60s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .rise { animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    .mob { display: none; }
    @media (max-width: 600px) { .desk { display: none; } .mob { display: inline; } }
  </style>
  <defs><linearGradient id="bghenlight" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfcfe"/><stop offset="1" stop-color="#f1f3fb"/></linearGradient><linearGradient id="acchenlight" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#0891b2"/></linearGradient><pattern id="dotshenlight" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#0f172a" fill-opacity="0.05"/></pattern><filter id="blurhenlight" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter><clipPath id="cliphenlight"><rect width="1200" height="360" rx="24"/></clipPath></defs>

  <g clip-path="url(#cliphenlight)">
    <rect width="1200" height="360" fill="url(#bghenlight)"/>
    <g filter="url(#blurhenlight)" opacity="0.45">
      <circle class="glow1" cx="860" cy="60" r="170" fill="#a78bfa"/>
      <circle class="glow2" cx="1120" cy="330" r="190" fill="#67e8f9"/>
    </g>
    <rect width="1200" height="360" fill="url(#dotshenlight)"/>
    <rect width="1200" height="3" fill="url(#acchenlight)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="24" fill="none" stroke="#0f172a" stroke-opacity="0.12"/>
  <g class="desk">
    <g class="rise" style="animation-delay:.05s">
      <text x="72" y="100" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="3.4" fill="#6d28d9">SENIOR FULL-STACK DEVELOPER</text>
      <text x="69" y="170" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-1" fill="#0f172a">Guilherme Andreúce</text>
    </g>
    <g class="rise" style="animation-delay:.15s">
      <text x="72" y="216" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#475569">I build the business-critical parts of a product: search,</text>
      <text x="72" y="250" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#475569">revenue, payments, integrations and deploys, with AI in the loop.</text>
    </g>
    <g transform="translate(0 280)"><g class="rise" style="animation-delay:.25s"><g transform="translate(72.0 0)"><rect x="0.5" y="0.5" width="167.2" height="39" rx="20.0" fill="#0f172a" fill-opacity="0.035" stroke="#0f172a" stroke-opacity="0.16"/><path d="M23 12 a5.4 5.4 0 0 1 5.4 5.4 c0 4 -5.4 9.8 -5.4 9.8 s-5.4 -5.8 -5.4 -9.8 a5.4 5.4 0 0 1 5.4 -5.4 z" fill="none" stroke="#6d28d9" stroke-width="1.8"/><circle cx="23" cy="17.4" r="1.9" fill="#6d28d9"/><text x="35.0" y="26.5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" fill="#475569">Brasília, Brazil</text></g><g transform="translate(252.2 0)"><rect x="0.5" y="0.5" width="188.9" height="39" rx="20.0" fill="#0f172a" fill-opacity="0.035" stroke="#0f172a" stroke-opacity="0.16"/><text x="18.0" y="26.5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" fill="#475569">Language-agnostic</text></g><g transform="translate(454.1 0)"><rect x="0.5" y="0.5" width="232.8" height="39" rx="20.0" fill="#0f172a" fill-opacity="0.035" stroke="#0f172a" stroke-opacity="0.16"/><text x="18.0" y="26.5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" fill="#475569">AI-assisted development</text></g></g></g>
    <g transform="translate(1000 180)">
      <circle r="78" fill="none" stroke="#0f172a" stroke-opacity="0.17"/><g class="spin" style="animation-duration:34s;animation-direction:normal"><circle r="89" fill="none"/><circle cx="67.5" cy="39.0" r="5" fill="#0891b2"/><circle cx="67.5" cy="39.0" r="11" fill="#0891b2" fill-opacity="0.18"/></g><circle r="126" fill="none" stroke="#0f172a" stroke-opacity="0.17" stroke-dasharray="3 7"/><g class="spin" style="animation-duration:52s;animation-direction:reverse"><circle r="137" fill="none"/><circle cx="-118.4" cy="-43.1" r="5" fill="#7c3aed"/><circle cx="-118.4" cy="-43.1" r="11" fill="#7c3aed" fill-opacity="0.18"/><circle cx="109.1" cy="-63.0" r="5" fill="#ec4899"/><circle cx="109.1" cy="-63.0" r="11" fill="#ec4899" fill-opacity="0.18"/></g><circle r="174" fill="none" stroke="#0f172a" stroke-opacity="0.17"/><g class="spin" style="animation-duration:80s;animation-direction:normal"><circle r="185" fill="none"/><circle cx="0.0" cy="174.0" r="5" fill="#0891b2"/><circle cx="0.0" cy="174.0" r="11" fill="#0891b2" fill-opacity="0.18"/><circle cx="-142.5" cy="-99.8" r="5" fill="#7c3aed"/><circle cx="-142.5" cy="-99.8" r="11" fill="#7c3aed" fill-opacity="0.18"/><circle cx="87.0" cy="-150.7" r="5" fill="#ec4899"/><circle cx="87.0" cy="-150.7" r="11" fill="#ec4899" fill-opacity="0.18"/></g>
      <circle r="48" fill="url(#acchenlight)"/><circle r="48" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
      <text y="12" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="1" fill="#ffffff">GA</text>
    </g>
  </g>
  <g class="mob">
    <text x="72" y="98" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="600" letter-spacing="4" fill="#6d28d9">SENIOR FULL-STACK DEVELOPER</text>
    <text x="67" y="195" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="101.0" font-weight="700" letter-spacing="-2" fill="#0f172a">Guilherme Andreúce</text>
    <text x="72" y="259" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="42" fill="#475569">Search · Payments · Integrations · AI</text>
  </g>
</svg>
