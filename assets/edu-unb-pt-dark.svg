<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" role="img" aria-label="Formação: Universidade de Brasília (UnB), Bacharelado em Ciência da Computação.">
  <title>Formação: Universidade de Brasília (UnB), Bacharelado em Ciência da Computação.</title>
  <style>
    .glow1 { animation: drift1 20s ease-in-out infinite alternate; }
    .glow2 { animation: drift2 24s ease-in-out infinite alternate; }
    @keyframes drift1 { to { transform: translate(120px, 40px); } }
    @keyframes drift2 { to { transform: translate(-140px, -30px); } }
    .spin { animation: spin 60s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .rise { animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    .mob { display: none; }
    @media (max-width: 600px) { .desk { display: none; } .mob { display: inline; } }
  </style>
  <defs><linearGradient id="acceptdark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f43f5e"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><clipPath id="clipeptdark"><rect width="1200" height="160" rx="22"/></clipPath></defs>

  <g clip-path="url(#clipeptdark)">
    <rect width="1200" height="160" fill="#ffffff" fill-opacity="0.035"/>
    <rect width="6" height="160" fill="url(#acceptdark)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="159" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
  <g transform="translate(44 32)"><defs><clipPath id="lteptdark"><rect width="96" height="96" rx="25.9"/></clipPath></defs><rect width="96" height="96" rx="25.9" fill="#ffffff"/><image href="data:image/svg+xml;base64," x="9.6" y="28.8" width="76.8" height="38.4"/><rect x="0.5" y="0.5" width="95" height="95" rx="25.9" fill="none" stroke="#ffffff" stroke-opacity="0.18"/></g>
  <g class="desk"><g class="rise">
    <text x="168" y="62" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.2" fill="#fb7185">FORMAÇÃO</text>
    <text x="168" y="100" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#f4f4f5">Universidade de Brasília (UnB)</text>
    <text x="168" y="131" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#a1a1aa">Bacharelado em Ciência da Computação</text>
  </g></g>
  <g class="mob">
    <text x="168" y="85" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="700" fill="#f4f4f5">Universidade de Brasília (UnB)</text>
    <text x="168" y="135" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="38" fill="#a1a1aa">Bacharelado em Ciência da Computação</text>
  </g>
</svg>
