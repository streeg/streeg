<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Guilherme Andreúce, Desenvolvedor Full-Stack Sênior. Construo as partes críticas de um produto: busca, receita, pagamentos, integrações e deploy, com IA no fluxo.">
  <title>Guilherme Andreúce, Desenvolvedor Full-Stack Sênior. Construo as partes críticas de um produto: busca, receita, pagamentos, integrações e deploy, com IA no fluxo.</title>
  <style>
    .glow1 { animation: drift1 20s ease-in-out infinite alternate; }
    .glow2 { animation: drift2 24s ease-in-out infinite alternate; }
    @keyframes drift1 { to { transform: translate(120px, 40px); } }
    @keyframes drift2 { to { transform: translate(-140px, -30px); } }
    .spin { animation: spin 60s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .rise { animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    .mob { display: none; }
    @media (max-width: 600px) { .desk { display: none; } .mob { display: inline; } }
  </style>
  <defs><linearGradient id="bghptdark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#101626"/></linearGradient><linearGradient id="acchptdark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#0891b2"/></linearGradient><pattern id="dotshptdark" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#ffffff" fill-opacity="0.045"/></pattern><filter id="blurhptdark" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter><clipPath id="cliphptdark"><rect width="1200" height="360" rx="24"/></clipPath></defs>

  <g clip-path="url(#cliphptdark)">
    <rect width="1200" height="360" fill="url(#bghptdark)"/>
    <g filter="url(#blurhptdark)" opacity="0.4">
      <circle class="glow1" cx="860" cy="60" r="170" fill="#7c3aed"/>
      <circle class="glow2" cx="1120" cy="330" r="190" fill="#06b6d4"/>
    </g>
    <rect width="1200" height="360" fill="url(#dotshptdark)"/>
    <rect width="1200" height="3" fill="url(#acchptdark)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
  <g class="desk">
    <g class="rise" style="animation-delay:.05s">
      <text x="72" y="100" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="3.4" fill="#a78bfa">DESENVOLVEDOR FULL-STACK SÊNIOR</text>
      <text x="69" y="170" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-1" fill="#f0f3f8">Guilherme Andreúce</text>
    </g>
    <g class="rise" style="animation-delay:.15s">
      <text x="72" y="216" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#9aa4b2">Construo as partes críticas de um produto: busca, receita,</text>
      <text x="72" y="250" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#9aa4b2">pagamentos, integrações e deploy, com IA no fluxo.</text>
    </g>
    <g transform="translate(0 280)"><g class="rise" style="animation-delay:.25s"><g transform="translate(72.0 0)"><rect x="0.5" y="0.5" width="167.2" height="39" rx="20.0" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.16"/><path d="M23 12 a5.4 5.4 0 0 1 5.4 5.4 c0 4 -5.4 9.8 -5.4 9.8 s-5.4 -5.8 -5.4 -9.8 a5.4 5.4 0 0 1 5.4 -5.4 z" fill="none" stroke="#a78bfa" stroke-width="1.8"/><circle cx="23" cy="17.4" r="1.9" fill="#a78bfa"/><text x="35.0" y="26.5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" fill="#9aa4b2">Brasília, Brasil</text></g><g transform="translate(252.2 0)"><rect x="0.5" y="0.5" width="218.4" height="39" rx="20.0" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.16"/><text x="18.0" y="26.5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" fill="#9aa4b2">Agnóstico a linguagem</text></g><g transform="translate(483.6 0)"><rect x="0.5" y="0.5" width="234.6" height="39" rx="20.0" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.16"/><text x="18.0" y="26.5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" fill="#9aa4b2">Desenvolvimento com IA</text></g></g></g>
    <g transform="translate(1000 180)">
      <circle r="78" fill="none" stroke="#ffffff" stroke-opacity="0.14"/><g class="spin" style="animation-duration:34s;animation-direction:normal"><circle r="89" fill="none"/><circle cx="67.5" cy="39.0" r="5" fill="#0891b2"/><circle cx="67.5" cy="39.0" r="11" fill="#0891b2" fill-opacity="0.18"/></g><circle r="126" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-dasharray="3 7"/><g class="spin" style="animation-duration:52s;animation-direction:reverse"><circle r="137" fill="none"/><circle cx="-118.4" cy="-43.1" r="5" fill="#7c3aed"/><circle cx="-118.4" cy="-43.1" r="11" fill="#7c3aed" fill-opacity="0.18"/><circle cx="109.1" cy="-63.0" r="5" fill="#ec4899"/><circle cx="109.1" cy="-63.0" r="11" fill="#ec4899" fill-opacity="0.18"/></g><circle r="174" fill="none" stroke="#ffffff" stroke-opacity="0.14"/><g class="spin" style="animation-duration:80s;animation-direction:normal"><circle r="185" fill="none"/><circle cx="0.0" cy="174.0" r="5" fill="#0891b2"/><circle cx="0.0" cy="174.0" r="11" fill="#0891b2" fill-opacity="0.18"/><circle cx="-142.5" cy="-99.8" r="5" fill="#7c3aed"/><circle cx="-142.5" cy="-99.8" r="11" fill="#7c3aed" fill-opacity="0.18"/><circle cx="87.0" cy="-150.7" r="5" fill="#ec4899"/><circle cx="87.0" cy="-150.7" r="11" fill="#ec4899" fill-opacity="0.18"/></g>
      <circle r="48" fill="url(#acchptdark)"/><circle r="48" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
      <text y="12" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="1" fill="#ffffff">GA</text>
    </g>
  </g>
  <g class="mob">
    <text x="72" y="98" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="600" letter-spacing="4" fill="#a78bfa">DESENVOLVEDOR FULL-STACK SÊNIOR</text>
    <text x="67" y="195" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="101.0" font-weight="700" letter-spacing="-2" fill="#f0f3f8">Guilherme Andreúce</text>
    <text x="72" y="259" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="42" fill="#9aa4b2">Busca · Pagamentos · Integrações · IA</text>
  </g>
</svg>
